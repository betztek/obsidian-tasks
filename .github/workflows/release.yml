name: Release Obsidian Plugin (custom)

# Releases whenever manifest.json "version" is bumped on custom.
#   - push to custom that changes manifest.json: release if the version has no tag yet,
#     otherwise skip quietly (success).
#   - manual: Actions → "Release Obsidian Plugin (custom)" → Run workflow. Fails if the tag exists.
# Tag and release name are the manifest version (no "v" prefix), which is what BRAT expects.

on:
  push:
    branches: [custom]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release from anything but the custom branch
        if: github.ref != 'refs/heads/custom'
        run: |
          echo "::error::Releases must be run from the 'custom' branch (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'yarn'

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::manifest.json has no version"
            exit 1
          fi
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Tag ${VERSION} already exists. Bump the version in manifest.json first."
              exit 1
            fi
            echo "::notice::${VERSION} is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and build
        if: steps.check.outputs.release == 'true'
        run: |
          yarn --frozen-lockfile
          yarn run build

      - name: Run tests
        if: steps.check.outputs.release == 'true'
        run: yarn run test

      - name: Check build outputs exist
        if: steps.check.outputs.release == 'true'
        run: ls -l main.js manifest.json styles.css

      - name: Create tag and GitHub Release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION}"
          gh release create "$VERSION" \
            --verify-tag \
            --title "$VERSION" \
            --notes "Custom build ${VERSION} from ${GITHUB_SHA}." \
            --latest \
            main.js manifest.json styles.css
